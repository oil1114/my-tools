name: Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      reset_baseline:
        type: boolean
        default: false
      orders_report:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: chain
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ok=""
          for i in 1 2 3; do
            if gh workflow run monitor.yml -R ${{ github.repository }}; then
              ok=1; break
            fi
            echo "dispatch attempt $i failed, retrying..."
            sleep 25
          done
          if [ -z "$ok" ]; then
            today=$(TZ=Asia/Taipei date +%F)
            if [ "$(cat dispatch_alert.txt 2>/dev/null)" != "$today" ]; then
              curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT_ID}" --data-urlencode \
                text="⚠️ 接力觸發失敗（DISPATCH_TOKEN 可能過期或權限異常）。目前由 30 分鐘備援排程維持運作，但頻率變低，請儘快更換 token。"
              echo "$today" > dispatch_alert.txt
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        timeout-minutes: 15
        run: |
          pip install playwright pillow
          # apt 鏡像可能整個懸掛（2026-08-19 曾連續卡死 6 小時），所有會碰 apt 的指令都要包 timeout
          if ! timeout 240 python -m playwright install --with-deps chromium; then
            echo "with-deps failed or hung, falling back to browser-only install"
            ok=""
            for i in 1 2 3; do
              if timeout 120 python -m playwright install chromium; then ok=1; break; fi
              echo "install attempt $i failed, retrying..."
              sleep 10
            done
            [ -n "$ok" ]
          fi
          timeout 120 sudo apt-get install -y -qq fonts-noto-cjk || true

      - name: pace
        run: sleep 300

      - name: run
        env:
          TZ: Asia/Taipei
          FE_ACCOUNT: ${{ secrets.FE_ACCOUNT }}
          FE_PASSWORD: ${{ secrets.FE_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
          RESET_BASELINE: ${{ github.event.inputs.reset_baseline == 'true' && '1' || '' }}
          ORDERS_REPORT: ${{ github.event.inputs.orders_report == 'true' && '1' || '' }}
          WATCH_DOWS: ${{ vars.WATCH_DOWS }}
          WATCH_START_HOUR: ${{ vars.WATCH_START_HOUR }}
          WATCH_END_HOUR: ${{ vars.WATCH_END_HOUR }}
        run: python monitor.py

      - name: save
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json reset_date.txt alert_date.txt tg_offset.txt dispatch_alert.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for f in state.json reset_date.txt alert_date.txt tg_offset.txt dispatch_alert.txt; do
              [ -f "$f" ] && git add "$f"
            done
            git commit -m "update state [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
