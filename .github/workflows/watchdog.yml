name: Watchdog

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        type: boolean
        default: false
      test_restart:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert == 'true' && '1' || '' }}
          TEST_RESTART: ${{ github.event.inputs.test_restart == 'true' && '1' || '' }}
          RESTART_MIN: "45"
          STALL_MIN: "90"
          REMIND_MIN: "360"
        run: |
          set -e
          send() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" --data-urlencode text="$1")
            echo "telegram: $code"
          }
          save() {
            echo "$1" > watchdog_alert.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add watchdog_alert.txt
            git commit -m "update state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || true
          }
          restart() {
            for i in 1 2 3; do
              if gh workflow run monitor.yml -R "$GITHUB_REPOSITORY"; then
                echo "restart dispatched"
                return 0
              fi
              echo "restart attempt $i failed, retrying..."
              sleep 20
            done
            echo "restart dispatch FAILED"
          }

          if [ -n "$TEST_ALERT" ]; then
            send "🧪 watchdog 測試：警報通道正常"
            exit 0
          fi
          if [ -n "$TEST_RESTART" ]; then
            restart
            exit 0
          fi

          # 每天台灣時間 09:13 那輪：檢查 DISPATCH_TOKEN 是否快過期
          if [ "$(TZ=Asia/Taipei date +%H)" = "09" ] && [ "$(date +%M)" -lt 30 ] && [ -n "$DISPATCH_TOKEN" ]; then
            exp=$(curl -sI -H "Authorization: Bearer $DISPATCH_TOKEN" https://api.github.com/user \
              | tr -d '\r' | grep -i '^github-authentication-token-expiration:' | cut -d' ' -f2- || true)
            if [ -n "$exp" ]; then
              exp_ts=$(date -d "$exp" +%s 2>/dev/null || echo 0)
              days=$(( (exp_ts - $(date +%s)) / 86400 ))
              if [ "$exp_ts" -gt 0 ] && [ "$days" -le 7 ]; then
                send "🔔 DISPATCH_TOKEN 將在約 ${days} 天後過期，請到 GitHub 產生新 token 並更新 repo secret，否則排程會退化成每 30 分鐘一輪。"
              fi
            fi
          fi

          last=$(gh run list -R "$GITHUB_REPOSITORY" -w monitor.yml --status success --limit 1 --json updatedAt -q '.[0].updatedAt' || echo "")
          now=$(date +%s)
          last_ts=0
          [ -n "$last" ] && last_ts=$(date -d "$last" +%s)
          age_min=$(( (now - last_ts) / 60 ))
          echo "last success: ${last:-none} (${age_min} min ago)"
          prev=$(cat watchdog_alert.txt 2>/dev/null || echo 0)

          if [ "$age_min" -ge "$RESTART_MIN" ]; then
            # 先砍掉懸掛超過 RESTART_MIN 的 run，釋放 concurrency group——
            # 否則新派發的 run 只會在佇列裡等待、然後被更新的 run 取消，重啟等於無效
            stuck=$(gh run list -R "$GITHUB_REPOSITORY" -w monitor.yml --status in_progress \
              --limit 10 --json databaseId,startedAt \
              -q '.[] | select((now - (.startedAt | fromdate)) / 60 > '"$RESTART_MIN"') | .databaseId' || true)
            for id in $stuck; do
              echo "cancelling stuck run $id"
              gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            done
            restart
          fi

          if [ "$age_min" -lt "$STALL_MIN" ]; then
            if [ "$prev" != "0" ]; then
              send "✅ 監控已恢復正常執行"
              save 0
            fi
            exit 0
          fi

          since_alert=$(( (now - prev) / 60 ))
          if [ "$since_alert" -lt "$REMIND_MIN" ]; then
            echo "already alerted ${since_alert} min ago, skip"
            exit 0
          fi
          if [ "$last_ts" -gt 0 ]; then
            last_local=$(TZ=Asia/Taipei date -d "$last" "+%m/%d %H:%M")
            send "⚠️ 監控已停擺：最後一次成功執行是 ${last_local}（約 ${age_min} 分鐘前）。已自動嘗試重啟；若持續收到此訊息表示自動修復無效，需要人工處理。"
          else
            send "⚠️ 監控已停擺：近期查無成功執行紀錄。已自動嘗試重啟；若持續收到此訊息表示自動修復無效，需要人工處理。"
          fi
          save "$now"
